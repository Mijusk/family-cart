<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF3EA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Family App</title>
    <style>
      /* Painted with the page itself, before the app's code arrives; same look as App.vue's loading screen. */
      body { margin: 0; background: #eef3ea; }
      .splash { max-width: 560px; min-height: 100dvh; margin-inline: auto; padding: 32px 16px; box-sizing: border-box;
        display: flex; flex-direction: column; justify-content: center; gap: 24px;
        font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #5b6b5f; }
      .splash p { margin: 0; }
      .splash p:first-child { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="splash" aria-busy="true"><p>Family App</p><p>Cargando…</p></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
